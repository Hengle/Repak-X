name: Build and Release
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main  # Triggers on push to main branch
    # The jobs only run if the commit message contains a keyword:
    #   [run-ci]  build every platform, then tag + publish the GitHub release
    #   [dry-ci]  build and package every platform only - no tag, release or Discord post
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab
    inputs:
      release:
        description: 'Publish a GitHub release (untick for a build-only dry run)'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # BUILD JOB - Builds and packages the Windows and Linux releases
  # ============================================================================
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (contains(github.event.head_commit.message, '[run-ci]') ||
         contains(github.event.head_commit.message, '[dry-ci]')))
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dotnet_rid: win-x64
            artifact_name: Repak-X-Windows
            artifact_ext: .zip
            sccache_path: C:\Users\runneradmin\.cache\sccache
          # 22.04 rather than latest: the binary then only needs glibc 2.35, so it runs
          # on older distros too. It is the oldest runner that ships webkit2gtk-4.1.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            dotnet_rid: linux-x64
            artifact_name: Repak-X-Linux
            artifact_ext: .tar.gz
            sccache_path: /home/runner/.cache/sccache
    
    runs-on: ${{ matrix.os }}
    
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ matrix.sccache_path }}
      SCCACHE_IDLE_TIMEOUT: 0
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      # ========== Setup Tools ==========
      # Tauri needs the GTK/WebKit dev packages; NativeAOT links with clang and zlib.
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev \
            clang zlib1g-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ========== Caching ==========
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: repak-x/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('repak-x/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Frontend Dependencies
        working-directory: repak-x
        run: npm install

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust Build (target folder)
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'repak-x/tauri.conf.json', 'repak-x/package.json') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'repak-x/tauri.conf.json', 'repak-x/package.json') }}-
            ${{ runner.os }}-cargo-target-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.sccache_path }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Start sccache server
        shell: bash
        run: |
          sccache --start-server
          sccache --show-stats

      # ========== Read Version ==========
      - name: Read Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # ========== Build UAssetTool (NativeAOT) ==========
      - name: Build UAssetTool (NativeAOT)
        shell: bash
        run: |
          echo "Building UAssetTool NativeAOT library for ${{ matrix.dotnet_rid }}..."
          dotnet publish UAssetToolRivals/src/UAssetTool/UAssetToolNative.csproj \
            -c Release \
            -r ${{ matrix.dotnet_rid }} \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o target/uassettool

      # ========== Sync Version ==========
      - name: Sync Tauri Config Version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cd repak-x
          # Update version in tauri.conf.json to match Cargo.toml
          sed -i'' -e "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" tauri.conf.json

      # ========== Build Application ==========
      - name: Build Frontend
        working-directory: repak-x
        run: npm run build

      - name: Build Rust Application
        shell: bash
        env:
          # The NativeAOT UAssetTool library was already published into target/uassettool
          # above; tell build.rs not to rebuild it (it's bundled from there at package time).
          SKIP_UASSET_TOOL_BUILD: '1'
        run: |
          cargo build --release --target ${{ matrix.target }} --features custom-protocol

      # ========== Package - Windows ==========
      - name: Package Windows Distribution
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $distDir = "dist"
          $packageDir = "$distDir/Repak-X-v$version-Windows"
          
          # Create directories
          New-Item -ItemType Directory -Force -Path $packageDir
          
          # Copy main executable
          Copy-Item "target/${{ matrix.target }}/release/REPAK-X.exe" "$packageDir/"
          
          # Copy UAssetTool and dependencies
          Copy-Item "target/uassettool/*" "$packageDir/" -Recurse
          if (Test-Path "$packageDir/*.pdb") { Remove-Item "$packageDir/*.pdb" }
          if (Test-Path "$packageDir/UAssetTool.exe") { Remove-Item "$packageDir/UAssetTool.exe" }
          
          # Create ZIP
          $zipPath = "$distDir/Repak-X-v$version-Windows.zip"
          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath -Force
          
          $zipSize = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "Windows ZIP created: $zipSize MB"
          
          echo "ARTIFACT_PATH=$zipPath" >> $env:GITHUB_OUTPUT

      # ========== Package - Linux ==========
      - name: Package Linux Distribution
        if: runner.os == 'Linux'
        id: package_linux
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          DIST_DIR="dist"
          PACKAGE_NAME="Repak-X-v$VERSION-Linux"
          PACKAGE_DIR="$DIST_DIR/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR"

          # Copy main executable
          cp "target/${{ matrix.target }}/release/REPAK-X" "$PACKAGE_DIR/"
          chmod +x "$PACKAGE_DIR/REPAK-X"

          # dotnet names the NativeAOT library after the assembly (UAssetTool.so); the
          # app loads it as libUAssetTool.so from beside the executable.
          cp "target/uassettool/UAssetTool.so" "$PACKAGE_DIR/libUAssetTool.so"

          # Any other native libraries the publish produced (none today), minus debug files
          find target/uassettool -maxdepth 1 -name '*.so' ! -name 'UAssetTool.so' \
            -exec cp {} "$PACKAGE_DIR/" \;

          # One top-level folder in the archive; the in-app updater unwraps it.
          TAR_PATH="$DIST_DIR/$PACKAGE_NAME.tar.gz"
          tar -czf "$TAR_PATH" -C "$DIST_DIR" "$PACKAGE_NAME"

          echo "Linux tarball created: $(du -h "$TAR_PATH" | cut -f1)"
          tar -tzf "$TAR_PATH"

          echo "ARTIFACT_PATH=$TAR_PATH" >> "$GITHUB_OUTPUT"

      # ========== Upload Artifacts ==========
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-v${{ steps.version.outputs.VERSION }}
          path: ${{ steps.package_windows.outputs.ARTIFACT_PATH || steps.package_linux.outputs.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Stop sccache and show stats
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

  # ============================================================================
  # RELEASE JOB - Creates GitHub release with all artifacts
  # ============================================================================
  release:
    needs: build
    # Skipped on a dry run ([dry-ci], or a manual run with "release" unticked): the
    # build job above has already proven that every platform compiles and packages.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-ci]'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Repak-X-*-v${{ needs.build.outputs.version }}
          path: dist/
          merge-multiple: true

      - name: List Downloaded Artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la dist/

      - name: Extract Changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          # Extract everything between ## [VERSION] and the next ## [ or --- or EOF
          CHANGELOG=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[|^---/{if(found) exit} found{print}" CHANGELOG.md)
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changelog entry found for v$VERSION."
          fi
          
          # Write to file to avoid multiline env var issues
          echo "$CHANGELOG" > /tmp/changelog_body.md
          echo "CHANGELOG_FILE=/tmp/changelog_body.md" >> $GITHUB_OUTPUT
          
          echo "Extracted changelog for v$VERSION:"
          cat /tmp/changelog_body.md

      - name: Create and Push Tag
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping tag creation"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Repak X v${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: ${{ steps.changelog.outputs.CHANGELOG_FILE }}
          files: |
            dist/Repak-X-v${{ needs.build.outputs.version }}-Windows.zip
            dist/Repak-X-v${{ needs.build.outputs.version }}-Linux.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.CHANGELOG_FILE }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook not configured, skipping notification"
            exit 0
          fi
          
          RELEASE_URL="https://github.com/XzantGaming/Repak-X/releases/tag/v${VERSION}"
          CHANGELOG=$(cat "$CHANGELOG_FILE" 2>/dev/null || echo "")
          
          # Build message - header first, then changelog
          MESSAGE="<@&1472639362557542510> <:RepakXApp:1448417099318956133> **Repak X v${VERSION}** is out!
          ${RELEASE_URL}
          
          ${CHANGELOG}"
          
          # Truncate to Discord's 2000 char limit if needed
          if [ ${#MESSAGE} -gt 2000 ]; then
            MESSAGE="${MESSAGE:0:1997}..."
          fi
          
          # Send to Discord
          curl -s -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK"
          
          echo "Discord notification sent!"
